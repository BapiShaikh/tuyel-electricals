services:
  - type: web
    name: tuyel-electricals-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WHATSAPP_NUMBER
        value: "916294156854"

